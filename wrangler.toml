name = "vexrecon"
pages_build_output_dir = "public"
compatibility_date = "2025-01-01"

# D1 database holding all of Recon's data (created with `npx wrangler d1 create vexrecon`).
[[d1_databases]]
binding = "DB"
database_name = "vexrecon"
database_id = "3dbf49ca-edc2-4703-87c1-fa8470b2569f"

# Secrets are not kept here. Set ROBOTEVENTS_KEY, ADMIN_CODE and (original install only) TEAM_CODE in the Cloudflare
# dashboard (Workers & Pages -> vexrecon -> Settings -> Variables and Secrets), or in .dev.vars for local preview.
